app = "studio-jf-designer-alicia"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  STUDIO_OFFICIAL_NUMBER = "5521960003154"
  OWNER_PERSONAL_NUMBER = "5521993826303"
  STUDIO_PIX_KEY = "21960003154"
  DATABASE_URL = "file:/data/dev.db"
  BAILEYS_AUTH_DIR = "/data/auth_info_baileys"

[mounts]
  source = "studio_jf_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"
